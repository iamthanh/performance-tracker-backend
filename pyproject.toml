[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fitness-hub-core"
version = "0.1.0"
description = "Local-first ingestion of Strava, Garmin Connect and Google Health data into SQLite (core library of fitness-hub)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# garminconnect 0.3.x needs Python >= 3.12; on 3.11 the extra installs nothing
# and the Garmin provider reports a clear error (CSV import still works).
garmin = ["garminconnect>=0.3.17,<0.4; python_version >= '3.12'"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
